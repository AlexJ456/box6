<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Breathing</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Meta tags for iOS -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Box Breathing">

  <!-- Icons for iOS -->
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-icon-167x167.png">

  <!-- Styling -->
  <style>
    /* Base styles */
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Open Sans, Helvetica Neue, sans-serif;
      margin: 0;
      padding: 0;
      background-color: black;
      color: #ffedd5; /* amber-100 */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Add other existing styles here */
  </style>
</head>
<body>
<div class="container" id="app">
  <!-- App content will be dynamically inserted here -->
</div>

<script src="app.js"></script>

<script>
  // Service Worker Registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(registration => {
          console.log('ServiceWorker registration successful with scope:', registration.scope);
        })
        .catch(error => {
          console.log('ServiceWorker registration failed:', error);
        });
    });
  }

  // Add iOS installation tip
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

  if (isIOS && !isInStandaloneMode && !localStorage.getItem('iosInstallTipShown')) {
    const iosInstallTip = document.createElement('div');
    iosInstallTip.classList.add('ios-install-tip');
    iosInstallTip.innerHTML = `
      <div class="tip-content">
        <p>Install this app on your iPhone: tap <strong>Share</strong> 
        <span class="share-icon"></span> then <strong>Add to Home Screen</strong> 
        <span class="home-icon"></span></p>
        <button class="close-tip">Got it</button>
      </div>`;
    document.body.appendChild(iosInstallTip);
    document.querySelector('.close-tip').addEventListener('click', () => {
      iosInstallTip.style.display = 'none';
      localStorage.setItem('iosInstallTipShown', true);
    });
  }
</script>
</body>
</html>
